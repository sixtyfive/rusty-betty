[package]
name = "rusty-betty"
version = "0.1.0"
edition = "2021"
default-run = "rusty-betty"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c6", "unstable"] }
esp-hal-smartled = { version = "0.18.0" }
# the versions with which esp-hal-smartled 0.18.0. was tested
esp-backtrace = { version = "0.20", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c6", "auto"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }
smart-leds = "0.4.0"
esp-rtos = { version = "0.4.0", features = ["esp32c6", "embassy", "esp-radio", "esp-alloc"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c6", "wifi", "esp-alloc"] }
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = ["dhcpv4", "dns", "medium-ethernet", "tcp", "udp"] }
rust-mqtt = { version = "=0.6.0", default-features = false, features = ["v5", "alloc"] }
static_cell = "2"
nb = "1"

[build-dependencies]
toml = "0.8"

[profile.release]
opt-level = "s"
