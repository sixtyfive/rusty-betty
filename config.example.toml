[wifi]
ssid = "..."
password = "..."

[cat]
name = "..."
active_actuator = "both" # "both", "magnet" or "servo"

# eye LED brightness (%)
led_brightness = 25

# how long the eyes keep blinking after a wave command (ms)
eye_activity_duration = 30000

[servo]
# neutral/rest angle, in degrees
middle_angle = 90

# degrees for the servo to move, one after the other:
# the arm will go from one angle to the next, with a
# short pause in between
swing_angles = [155, 25, 155, 50, 130, 75, 105]

# range (again in °) covered by the pulse widths below
angle_min = 0
angle_max = 180

# control pulse widths (microseconds) at angle_min / angle_max
# testing servo was a 4.8V metal-gear 2.2kg ZD Racing Servo
# (https://www.rovansports.nl/en/servo-22-kg.html)
pulse_min_us = 800
pulse_max_us = 2200

# how long the arm takes to move between two angles
sweep_ms = 300

# steps per movement; higher is smoother (but needs more CPU)
steps = 20

[mqtt]
url = "mqtt://mqtt.winkekatze24.de:1883"
keepalive_ms = 30000

# these are for the Winke Vier.Miau boards (any revision)
# meowbe only change them if you're sure about having to do so...
[pins]
led_builtin = 8
eye_leds = 14
blink = 22
i2c_sda = 3
i2c_scl = 4
pwm = 21
adc = 0
